plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kimtjun.cardspendingwidget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kimtjun.cardspendingwidget'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.8'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
