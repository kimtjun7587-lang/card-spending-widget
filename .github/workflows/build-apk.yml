name: Build Android APK

on:
  push:
    branches: [ "main", "android-implementation", "final-locked-design", "fix-ingestion-midnight-v1.7", "fix-notification-only-v1.8" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: card-spending-widget-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Prepare download package
        run: |
          mkdir -p install-package
          cp app/build/outputs/apk/debug/app-debug.apk install-package/card-spending-widget.apk
          printf '설치: ZIP 압축을 풀고 card-spending-widget.apk를 Galaxy A16에서 누르세요.\n권한: SMS 권한은 사용하지 않습니다. 앱에서 알림 접근 권한 설정을 눌러 카드 소비 위젯을 허용하세요.\n자동반영: 삼성 메시지/Google 메시지의 롯데카드 승인·취소 알림을 읽어 자동 반영합니다.\n설정: 목표금액과 현재 소비주기/이번 주/오늘 사용액을 필요할 때 보정할 수 있습니다.\n기준: 카드 소비주기는 27일~다음 달 26일이며, 26일 마감 후 27일 새 주기로 리셋됩니다.\n위젯: 대표 위젯은 카드 소비 위젯 4×2 고정형이며 날짜 변경 방송 외에도 30분 주기 갱신을 사용합니다.\n진단: 앱 하단에서 알림 접근 상태와 마지막 알림 감지 결과를 확인할 수 있습니다.\n' > install-package/설치안내.txt

      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: card-spending-widget-install-v1.8
          path: install-package/
          if-no-files-found: error
