name: Build Android APK

on:
  push:
    branches: [ "main", "android-implementation", "final-locked-design" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: card-spending-widget-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Prepare download package
        run: |
          mkdir -p install-package
          cp app/build/outputs/apk/debug/app-debug.apk install-package/card-spending-widget.apk
          printf '설치: ZIP 압축을 풀고 card-spending-widget.apk를 Galaxy A16에서 누르세요.\n권한: SMS 수신 허용 + 필요 시 알림 접근 허용.\n설정: 목표금액, 현재 소비주기 초기 사용액, 필요 시 이번 주/오늘 초기 사용액을 입력하세요.\n기준: 카드 소비주기는 27일~다음 달 26일이며, 26일 마감 후 27일 새 주기로 리셋됩니다.\n위젯: 기존 홈 위젯을 제거하고 카드 소비 위젯 4×2를 새로 추가하세요.\n' > install-package/설치안내.txt

      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: card-spending-widget-install
          path: install-package/
          if-no-files-found: error
