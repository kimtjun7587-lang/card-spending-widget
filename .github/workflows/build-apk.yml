name: Isolated free trial APK and tests
on:
  push:
    branches: ["trial/spendable-beta-20260911"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: spendable-trial-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test pure calculation and SMS logic
        run: |
          mkdir -p core-classes
          javac -d core-classes app/src/main/java/com/kimtjun/cardspendingwidget/{BudgetEngine,LotteSmsParser,SmsIdentity}.java app/src/test/java/com/kimtjun/cardspendingwidget/CoreChecks.java
          java -cp core-classes com.kimtjun.cardspendingwidget.CoreChecks
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build original snapshot only for separate-install verification
        run: |
          git worktree add --detach ../original-preservation-fixture 0d230d9fd21f3bf15ec9336fbb0ca57a1ced375e
          gradle -p ../original-preservation-fixture :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 emulator integration and coexistence tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash scripts/emulator-check.sh
      - name: Prepare trial APK and installation guide
        if: always()
        run: |
          mkdir -p install-package verification
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk install-package/haruyeoyu-trial-0.1.apk
            cp docs/TRIAL_GUIDE_KO.md install-package/INSTALL_KO.md
            sha256sum install-package/haruyeoyu-trial-0.1.apk > install-package/SHA256SUMS.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging install-package/haruyeoyu-trial-0.1.apk > verification/apk-badging.txt
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs install-package/haruyeoyu-trial-0.1.apk > verification/apk-signature.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haruyeoyu-trial-install
          path: install-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            verification/
          if-no-files-found: warn
